<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Besöksräknare</title>
<style>
  :root {
    --bg: #111418;
    --fg: #f4f6f8;
    --muted: #8a94a0;
    --plus: #1f9d55;
    --plus-active: #157a41;
    --minus: #c53030;
    --minus-active: #9b2424;
    --warn: #f59e0b;
    --full: #ef4444;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top) 12px calc(12px + env(safe-area-inset-bottom));
    gap: 12px;
  }
  #status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px;
    font-size: 15px;
    color: var(--muted);
  }
  #status .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--ok);
  }
  body.offline #status {
    background: var(--full);
    color: #fff;
    font-weight: 600;
    border-radius: 0 0 10px 10px;
  }
  body.offline #status .dot { background: #fff; }

  #display {
    flex: 1.3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    transition: background-color .2s;
    min-height: 0;
    overflow: hidden;
  }
  #label { font-size: min(6vw, 3.5dvh); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  #value {
    font-size: min(38vw, 22dvh);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #cap { font-size: min(5.5vw, 3dvh); color: var(--muted); min-height: 1.2em; }
  body.warn #display { background: var(--warn); }
  body.full #display { background: var(--full); }
  body.warn #label, body.warn #cap, body.full #label, body.full #cap { color: rgba(255,255,255,.85); }
  body.offline #value { opacity: .35; }

  button {
    flex: 1;
    border: 0;
    border-radius: 18px;
    color: #fff;
    font-size: min(30vw, 14dvh);
    font-weight: 700;
    line-height: 1;
    touch-action: manipulation;
    cursor: pointer;
    min-height: 0;
  }
  #plus { background: var(--plus); }
  #plus:active { background: var(--plus-active); }
  #minus { background: var(--minus); }
  #minus:active { background: var(--minus-active); }
  button:disabled { background: #2a2f36 !important; color: #555c66; }
</style>
</head>
<body class="offline">
  <div id="status"><span class="dot"></span><span id="status-text">Ansluter…</span></div>
  <div id="display">
    <div id="label">Inne</div>
    <div id="value">–</div>
    <div id="cap"></div>
  </div>
  <button id="plus" aria-label="En person in" disabled>+</button>
  <button id="minus" aria-label="En person ut" disabled>−</button>

<script>
(function () {
  var valueEl = document.getElementById('value');
  var capEl = document.getElementById('cap');
  var statusText = document.getElementById('status-text');
  var plus = document.getElementById('plus');
  var minus = document.getElementById('minus');

  var device = '';
  try {
    device = localStorage.getItem('doorcounter-device');
    if (!device) {
      device = Math.random().toString(36).slice(2, 10);
      localStorage.setItem('doorcounter-device', device);
    }
  } catch (e) {
    device = Math.random().toString(36).slice(2, 10);
  }

  function render(s) {
    valueEl.textContent = s.value;
    var b = document.body.classList;
    b.remove('warn', 'full');
    if (s.capacity > 0) {
      capEl.textContent = 'Max ' + s.capacity;
      if (s.value >= s.capacity) b.add('full');
      else if (s.value >= s.capacity * 0.9) b.add('warn');
    } else {
      capEl.textContent = '';
    }
  }

  function setOnline(on) {
    document.body.classList.toggle('offline', !on);
    statusText.textContent = on ? 'Ansluten' : 'Ingen anslutning – vänta';
    plus.disabled = !on;
    minus.disabled = !on;
  }

  var es;
  function connect() {
    if (es) es.close();
    es = new EventSource('api/events');
    es.onopen = function () { setOnline(true); };
    es.onmessage = function (e) { setOnline(true); render(JSON.parse(e.data)); };
    es.onerror = function () {
      setOnline(false);
      // Some browsers give up permanently after certain errors; reconnect manually.
      if (es.readyState === EventSource.CLOSED) setTimeout(connect, 2000);
    };
  }

  function change(delta) {
    if (navigator.vibrate) navigator.vibrate(30);
    fetch('api/change', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ delta: delta, device: device }),
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(render).catch(function () {
      // Tap was not registered: block until the event stream reconnects.
      setOnline(false);
      connect();
    });
  }

  plus.addEventListener('click', function () { change(1); });
  minus.addEventListener('click', function () { change(-1); });

  // Phones suspend background tabs; force a fresh connection on return.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { setOnline(false); connect(); }
  });

  connect();
})();
</script>
</body>
</html>
