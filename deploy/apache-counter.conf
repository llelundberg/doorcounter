# DoorCounter - lines for the <VirtualHost *:443> block for mumindalen.nu in
# /etc/apache2/sites-available/default.conf. install-doorcounter.sh inserts them
# after the simplevote lines, between "# BEGIN doorcounter" / "# END doorcounter"
# markers, and replaces that block on each run.
# Requires: alias, headers, proxy, proxy_wstunnel (all enabled on the production server)
#
# Apache serves the static pages from public/:
#   /doorcounter/         counter page
#   /doorcounter/admin/   admin page
# and proxies the WebSocket backend:
#   /doorcounter/api  ->  ws://127.0.0.1:8083/api
#
# Only public/ is readable; the rest of the app directory (server.js,
# data/log.csv, .git, ...) is denied even though it lies in the web root.

    Alias /doorcounter /srv/www/mumindalen/doorcounter/public
    ProxyPass "/doorcounter/api" "ws://127.0.0.1:8083/api"
    <Directory /srv/www/mumindalen/doorcounter>
        Require all denied
    </Directory>
    <Directory /srv/www/mumindalen/doorcounter/public>
        Require all granted
        Header set Cache-Control "no-cache"
    </Directory>
