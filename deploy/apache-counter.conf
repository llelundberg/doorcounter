# DoorCounter - add inside the <VirtualHost *:443> block for mumindalen.nu
# in /etc/apache2/sites-available/default.conf (next to the simplevote lines).
# Requires: proxy, proxy_http (already enabled on the production server)
#
# Serves the counter at  https://mumindalen.nu/doorcounter/
# and the admin page at   https://mumindalen.nu/doorcounter/admin/
#
# The ProxyPass for /doorcounter/ also stops Apache from serving the app
# directory (server.js, data/log.csv) straight from the web root.

    RedirectMatch 301 ^/doorcounter$ /doorcounter/
    ProxyPass        "/doorcounter/api/events" "http://127.0.0.1:8083/api/events" flushpackets=on timeout=3600
    ProxyPass        "/doorcounter/"           "http://127.0.0.1:8083/"
    ProxyPassReverse "/doorcounter/"           "http://127.0.0.1:8083/"
    SetEnvIf Request_URI "^/doorcounter/api/events" no-gzip=1
