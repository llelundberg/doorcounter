# DoorCounter - include inside the <VirtualHost *:443> block for mumindalen.nu.
# Requires: a2enmod proxy proxy_http
#
# Serves the counter at  https://mumindalen.nu/doorcounter/
# and the admin page at   https://mumindalen.nu/doorcounter/admin/

RedirectMatch ^/doorcounter$ /doorcounter/

# Live update stream: no buffering, long timeout.
ProxyPass        /doorcounter/api/events http://127.0.0.1:3000/api/events flushpackets=on timeout=3600
ProxyPassReverse /doorcounter/api/events http://127.0.0.1:3000/api/events

ProxyPass        /doorcounter/ http://127.0.0.1:3000/
ProxyPassReverse /doorcounter/ http://127.0.0.1:3000/

# If mod_deflate is enabled, compression would buffer the event stream.
SetEnvIf Request_URI "^/doorcounter/api/events" no-gzip=1
