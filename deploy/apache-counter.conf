# DoorCounter - the one line for the <VirtualHost *:443> block for mumindalen.nu
# in /etc/apache2/sites-available/default.conf. install-doorcounter.sh inserts
# it after the simplevote lines and replaces it on each run.
# Requires: proxy, proxy_wstunnel (enabled on the production server)
#
# The pages are served from the web root as /doorcounter/ (access rules are
# in .htaccess); only the WebSocket backend needs proxying:
#   /doorcounter/api  ->  ws://127.0.0.1:8083/api

    ProxyPass "/doorcounter/api" "ws://127.0.0.1:8083/api"
